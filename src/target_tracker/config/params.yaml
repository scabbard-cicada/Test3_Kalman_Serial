# ============================================================
#  target_tracker 核心算法 —— EKF 与云台指令参数
#  改完本文件只需重启 launch，不需要重新编译
#
#  下面是离线整定得到的参考值。
# ============================================================

tracker_node:
  ros__parameters:
    # ---------- 过程噪声 Q ----------
    # sigma_jerk: 连续时间 jerk（加速度变化率）标准差，m/s^3
    #   物理含义是"你允许目标机动得多剧烈"
    #   调大 -> 更信观测，跟手但抖；调小 -> 更信模型，平滑但转弯处滞后
    #   离线 sweep：0.5 → 滞后，2~3 → 最优，>20 → 噪声透传，0.2 → 跟丢
    sigma_jerk: 2.0

    # ---------- 观测噪声 R（极坐标，两项分开） ----------
    # sigma_range:   测距标准差，m
    # sigma_bearing: 测角标准差，rad
    #   噪声椭圆沿视线方向长、横向窄，所以要在极坐标下分开建模
    #   推荐值比"相邻差分估出来的传感器噪声"略大，多出来的部分用来吸收低频漂移
    #   和离群点；这样 NIS 均值接近自由度 2，滤波器不会过度自信
    sigma_range: 0.17
    sigma_bearing: 0.0055

    # ---------- 初始协方差 P0 ----------
    # 位置的初始协方差由首帧观测按 G R Gᵀ 算出，不需要参数
    # 速度、加速度完全未知，给较大的初值
    p0_vel: 3.0
    p0_acc: 5.0

    # ---------- 离群点门控 ----------
    # NIS = νᵀ S⁻¹ ν 服从 χ²(2)
    #   13.8 ≈ χ²(0.999)  正常帧 99.9% 通过
    #    5.99 ≈ χ²(0.95)  更严格，会误杀部分正常帧
    #   设为 0 或负数则关闭门控
    gate_threshold: 13.8
    # reject：丢弃该帧；inflate：R 放大 inflate_factor 倍做一次弱更新
    outlier_policy: "reject"
    inflate_factor: 50.0

    # 新息方位分量是否 wrap 到 [-π, π]。只为复现"角度环绕"错误才设 false，
    # 设 false 时建议同时把 gate_threshold 设 0，否则门控会把错误掩盖成"大量离群点"
    wrap_innovation: true

    # ---------- 预测与云台 ----------
    # predict_dt: 云台指令的提前量，s
    #   物理含义 = 通信延迟 + 下位机响应滞后（+ 实战中的弹丸飞行时间）
    #   本题无弹丸：用串口驱动统计的 RTT 和实测电机滞后来定
    predict_dt: 0.08
    # 云台指令频率（Hz），与观测频率（50 Hz）无关
    cmd_rate: 100.0
    # 观测断流多久以后不再外推，切到 HOLD（s）。数据里最长的一次断流约 0.36 s
    max_coast: 0.4
    # 断流超过该时长视为一个周期结束，命令云台缓慢归零（s）。周期间停顿约 4 s
    home_delay: 1.0
    # 云台零位朝向：世界系下 yaw = 0 时云台指向的方位角（rad）。站点在 (10, 0)，朝 -x
    gimbal_heading: 3.141592653589793
    # 是否发送角速度前馈。关掉后对比电机跟踪误差，就能看到前馈的作用
    use_feedforward: true
    # 是否请求打开激光（下位机只在 ARMED + TRACK + 目标有效时才真正点亮）
    laser_on: false

    # ---------- 其它 ----------
    # 观测中断超过该时长则重新初始化滤波器
    timeout_reset: 0.5
    frame_id: "map"
